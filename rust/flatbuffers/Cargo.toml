[package]
name = "flatbuffers"
version = "0.5.1"
edition = "2018"
authors = ["Robert Winslow <hello@rwinslow.com>", "FlatBuffers Maintainers"]
license = "Apache-2.0"
description = "Official FlatBuffers Rust runtime library."
homepage = "https://google.github.io/flatbuffers/"
repository = "https://github.com/google/flatbuffers"
keywords = ["flatbuffers", "serialization", "zero-copy"]
categories = ["encoding", "data-structures", "memory-management"]
rust-version = "1.51"

[features]
default = ["std"]
# Both deps must have their own std turned off by default and re-enabled here,
# or `--no-default-features` still drags std in transitively: ahash pinned
# features = ["std"] unconditionally, and ordered-float's default features pull
# num-traits/std. That is what broke the thumbv7m-none-eabi no_std build.
std = ["ahash/std", "ordered-float/std", "serde?/std"]
serialize = ["serde", "ordered-float/serde"]

[dependencies]
ahash = { version = "0.8", default-features = false }
bitflags = "2.8.0"
ordered-float = { version = "5", default-features = false }
serde = { version = "1.0", optional = true, default-features = false }

[build-dependencies]
rustc_version = "0.4.0"
