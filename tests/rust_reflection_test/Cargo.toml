[package]
name = "rust_reflection_test"
version = "0.1.0"
edition = "2018"

[dependencies]
flatbuffers-reflection = { path = "../../rust/reflection" }
flatbuffers = { path = "../../rust/flatbuffers" }
assert_approx_eq = "1.1.0"

# Read by tests/RustTest.sh and tests/RustTest.bat; see docs/source/languages/rust.md.
[package.metadata.rust-test]
clippy-debt = "src/lib.rs and the generated tests/monster_test code it includes predate the clippy gate"
clippy-debt-limit = 111
