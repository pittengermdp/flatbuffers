[package]
name = "rust_test_no_std_compilation"
version = "0.1.0"
edition = "2021"

[dependencies]
flatbuffers = { path = "../../rust/flatbuffers", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Read by tests/RustTest.sh and tests/RustTest.bat; see docs/source/languages/rust.md.
[package.metadata.rust-test]
skip = "a thumbv7m-none-eabi binary with no tests; RustTest.sh builds it and lints it in its own step"
